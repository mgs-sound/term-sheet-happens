[build]
  command = "npm run build"
  publish = "dist"

# The service worker itself must never be cached, or updates can't roll out.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
